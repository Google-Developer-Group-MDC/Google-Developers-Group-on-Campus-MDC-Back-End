# Render's free plan puts the API to sleep after ~15 minutes without traffic,
# which makes the next visitor wait ~50 s. Pinging the health check keeps it awake.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 https://gdg-mdc-api.onrender.com/api/health
